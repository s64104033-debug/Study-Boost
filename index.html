<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Boost</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F6F3;--card:#FFF;--ink:#22262B;--mut:#737980;--line:#E7E7E2;--acc:#3D5AFE;--accs:#E8ECFF;--ok:#2E9F6B;--warn:#E08A1E;--bad:#D6483F;--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17191C;--card:#202327;--ink:#ECEDEE;--mut:#9AA0A6;--line:#30343A;--acc:#7C93FF;--accs:#262C4A}}
:root[data-theme=dark]{--bg:#17191C;--card:#202327;--ink:#ECEDEE;--mut:#9AA0A6;--line:#30343A;--acc:#7C93FF;--accs:#262C4A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:700;font-size:20px;padding:0 12px 20px;letter-spacing:-.02em}.logo i{font-style:normal;background:var(--acc);color:#fff;border-radius:8px;padding:0 7px;margin-right:6px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--mut);font-weight:500;display:flex;gap:10px}
nav button:hover{background:var(--line)}nav button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
main{padding:36px clamp(16px,4vw,48px) 60px;max-width:1040px;width:100%}
h1{font-size:34px;letter-spacing:-.03em;margin:0 0 4px;line-height:1.1}h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}.c4{grid-column:span 4}.c6{grid-column:span 6}.c7{grid-column:span 7}.c5{grid-column:span 5}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero{background:var(--acc);color:#fff;border:0}.hero h2{font-size:26px;margin:4px 0 8px;letter-spacing:-.02em}.hero p{margin:0;opacity:.88}
.hero .btn{background:#fff;color:#22262B;margin-top:16px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:500}.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.s{padding:4px 10px;font-size:13px}.btn.d{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}.row b{font-weight:600}.row small{color:var(--mut);display:block}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}.done b{text-decoration:line-through;color:var(--mut)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--accs);color:var(--acc);font-weight:600;white-space:nowrap}
.tag.h{background:#fde7e5;color:var(--bad)}.tag.m{background:#fdf0dc;color:#b96d0a}.tag.t{background:#e0f4ea;color:var(--ok)}
.num{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}.lbl{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .5s}
.hb{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.hb span:last-child{text-align:right;color:var(--mut)}
.cols{display:flex;align-items:flex-end;gap:8px;height:130px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px;margin-bottom:4px;transition:height .5s}.cols i.o{background:var(--bad)}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}.donut b{background:var(--card);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.tip{border-left:3px solid var(--acc);padding:6px 0 6px 14px;margin:12px 0}.tip.w{border-color:var(--warn)}.tip.b{border-color:var(--bad)}
.note{color:var(--mut);font-size:13px}
.timer{font-size:56px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:24px;width:min(440px,92vw)}dialog::backdrop{background:#0006}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.pd{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;font-size:12px;background:var(--card)}.pd.t0{border-color:var(--acc)}.pd b{font-size:13px;display:block;margin-bottom:6px}.pd p{margin:4px 0;padding:4px 6px;background:var(--accs);border-radius:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;justify-content:space-around}.logo{display:none}nav button{flex-direction:column;align-items:center;gap:0;font-size:11px;padding:6px}main{padding-bottom:100px}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.pl{grid-template-columns:repeat(7,110px);overflow-x:auto}.planwrap{overflow-x:auto}h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog>
<script>
const K='studyboost.v1',$=s=>document.querySelector(s);
let S={tasks:[],sessions:[],cap:120,capOv:{},view:'today',fin:''},T=null;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const today=iso(new Date()),dd=s=>Math.round((new Date(s+'T00:00')-new Date(today+'T00:00'))/864e5);
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=m=>m>=60?(Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'')):m+'m';
const dl=s=>{const n=dd(s);return n<0?Math.abs(n)+'d overdue':n==0?'Today':n==1?'Tomorrow':new Date(s+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})};
const logged=t=>S.sessions.filter(x=>x.taskId==t.id).reduce((a,x)=>a+x.min,0);
const open=()=>S.tasks.filter(t=>t.status!='done');
const rem=t=>Math.max(15,t.est-logged(t));
function score(t){const n=dd(t.due),u=n<0?14:10/(n+1),p={Low:.8,Medium:1,High:1.3}[t.prio];return +(u*(1+t.diff/5)*(t.type=='Test'?1.6:1)*p+rem(t)/120).toFixed(2)}
const ranked=()=>open().map(t=>({t,s:score(t)})).sort((a,b)=>b.s-a.s).map(x=>x.t);
const capOn=d=>S.capOv[d]??S.cap;
function plan(){const days=[...Array(7)].map((_,i)=>({d:addD(i),items:[],left:capOn(addD(i))})),R={};ranked().forEach(t=>R[t.id]=rem(t));
 for(let pass=0;pass<3;pass++)days.forEach((D,i)=>ranked().forEach(t=>{if(R[t.id]<=0||D.left<=0||dd(t.due)<i)return;const c=Math.min(R[t.id],D.left,pass?120:60);D.items.push({t,c});R[t.id]-=c;D.left-=c}));
 return{days,risk:ranked().filter(t=>R[t.id]>0&&dd(t.due)<7)}}
function recs(){const r=[],o=ranked(),wk=S.sessions.filter(x=>dd(x.date)>-7);
 const dueT=o.filter(t=>dd(t.due)==1);if(dueT.length>1){const l=dueT.sort((a,b)=>b.est-a.est)[0];r.push(['',`You have ${dueT.length} tasks due tomorrow. Start with "${l.name}", your longest at ${fm(l.est)}.`])}
 [...new Set(o.filter(t=>t.type=='Test'&&dd(t.due)<=7).map(t=>t.subject))].forEach(s=>{if(!wk.some(x=>x.subject==s))r.push(['w',`You haven't studied ${s} this week and have a test in ${dd(o.find(t=>t.type=='Test'&&t.subject==s).due)} day(s).`])});
 const od=o.filter(t=>dd(t.due)<0);if(od.length)r.push(['b',`${od.length} task(s) are overdue. Don't restart: pick the smallest one and do 20 minutes now, then move the rest with Edit.`]);
 const sh=S.sessions.filter(x=>x.min<30),lg=S.sessions.filter(x=>x.min>=30);
 if(sh.length>=3&&lg.length>=3){const a=sh.filter(x=>x.done).length/sh.length,b=lg.filter(x=>x.done).length/lg.length;if(Math.abs(a-b)>.15)r.push(['',`You hit your goal in ${Math.round(a*100)}% of sessions under 30 min vs ${Math.round(b*100)}% of longer ones. ${a>b?'Shorter sessions seem to work for you.':'Longer sessions seem to work for you.'} (Based on ${S.sessions.length} sessions.)`])}
 const pl=plan();if(pl.risk.length)r.push(['w',`Your plan can't fully fit ${pl.risk.map(t=>t.name).join(', ')} before due dates. Raise today's study time or move a due date.`]);
 const est=estAct();if(est&&est.n>=3)r.push(['',`For finished tasks, your actual time averages ${Math.round(est.ratio*100)}% of your estimate. ${est.ratio>1.2?'Try padding new estimates.':est.ratio<.8?'You tend to overestimate, so you may have more free time than planned.':'Your estimates are pretty accurate.'}`]);
 if(!r.length)r.push(['','You\'re on track. Add tasks or log a session and this list will adapt.']);return r}
function estAct(){const d=S.tasks.filter(t=>t.status=='done'&&logged(t)>0);if(!d.length)return null;return{n:d.length,ratio:d.reduce((a,t)=>a+logged(t),0)/d.reduce((a,t)=>a+t.est,0)}}
const by=(arr,f,v)=>{const m={};arr.forEach(x=>m[f(x)]=(m[f(x)]||0)+v(x));return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const hbars=(rows,fmt=v=>v)=>{const mx=Math.max(...rows.map(r=>r[1]),1);return rows.length?rows.map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><span>${fmt(v)}</span></div>`).join(''):'<p class="note">Nothing to chart yet.</p>'};
const cols=(rows,fmt=v=>v)=>{const mx=Math.max(...rows.map(r=>r[1]),1);return`<div class="cols">${rows.map(([k,v,o])=>`<div title="${fmt(v)}"><i class="${o?'o':''}" style="height:${v/mx*100}%"></i>${k}</div>`).join('')}</div>`};
const streak=()=>{let n=0;for(let i=0;i<14;i++)if(S.sessions.some(x=>x.date==addD(-i)))n++;return n};
const msg=()=>{const o=open().length;return o==0?'All clear. Rest is part of the plan.':dd(ranked()[0].due)<0?'Plans slip. What matters is the next 20 minutes.':['A rough plan you follow beats a perfect plan you don\'t.','Small sessions add up. Start with one.','Something changed? Adjust the plan, not your goals.'][new Date().getDate()%3]};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function setS(fn,m){fn();save();render();if(m)toast(m)}
const tag=t=>`<span class="tag ${t.prio=='High'?'h':t.prio=='Medium'?'m':'t'}">${t.type=='Test'?'Test · ':''}${t.prio}</span>`;
const taskRow=(t,x='')=>`<div class="row ${t.status=='done'?'done':''}"><button class="chk ${t.status=='done'?'on':''}" aria-label="Toggle done" onclick="tog('${t.id}')">${t.status=='done'?'✓':''}</button><div class="g"><b>${esc(t.name)}</b><small>${esc(t.subject)} · ${dl(t.due)} · ${fm(t.est)}</small></div>${x}${tag(t)}</div>`;
function tog(id){const t=S.tasks.find(x=>x.id==id);setS(()=>t.status=t.status=='done'?'todo':'done',t.status=='done'?'':'Marked done')}
function render(){
 const V=[['today','◐','Today'],['tasks','☰','Tasks'],['plan','▦','Planner'],['study','◷','Study'],['stats','▤','Insights']];
 $('#nav').innerHTML='<div class="logo"><i>S</i>Study Boost</div>'+V.map(v=>`<button class="${S.view==v[0]?'on':''}" onclick="go('${v[0]}')"><span>${v[1]}</span>${v[2]}</button>`).join('');
 $('#main').innerHTML=({today:vToday,tasks:vTasks,plan:vPlan,study:vStudy,stats:vStats})[S.view]();
}
const go=v=>{S.view=v;save();render();scrollTo(0,0)};
function vToday(){const o=ranked(),pl=plan(),td=pl.days[0],tot=S.tasks.length,dn=S.tasks.filter(t=>t.status=='done').length,f=o[0];
 const wk=S.sessions.filter(x=>dd(x.date)>-7).reduce((a,x)=>a+x.min,0),tests=o.filter(t=>t.type=='Test').slice(0,3);
 if(!tot)return`<h1>Welcome to Study Boost</h1><p class="sub">Plans change. This app helps you adjust instead of starting over.</p><div class="card"><h2>Add your first task</h2><p class="note">Add an assignment or test and the planner will tell you what to do first.</p><div class="acts" style="justify-content:flex-start"><button class="btn p" onclick="edit()">Add task</button><button class="btn" onclick="sample()">Load sample data</button></div></div>`;
 return`<h1>${new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening'}</h1><p class="sub">${msg()}</p><div class="grid">
 <div class="card hero c8">${f?`<span class="lbl" style="color:#fff9">Focus first</span><h2>${esc(f.name)}</h2><p>${esc(f.subject)} · ${dl(f.due)} · ${fm(rem(f))} left · difficulty ${f.diff}/5. ${f.type=='Test'?'Test coming up.':''}</p><button class="btn" onclick="go('study');startFor('${f.id}')">Start a session</button>`:'<h2>Nothing open</h2><p>You\'re caught up.</p>'}</div>
 <div class="card c4"><div class="lbl">Progress</div><div class="num">${tot?Math.round(dn/tot*100):0}%</div><div class="bar" style="margin:10px 0"><i style="width:${tot?dn/tot*100:0}%"></i></div><div class="lbl">${dn} of ${tot} tasks done · ${fm(wk)} studied this week</div></div>
 <div class="card c7"><h2>Today's plan</h2>${td.items.length?td.items.map(i=>taskRow(i.t,`<span class="tag">${fm(i.c)}</span>`)).join(''):'<p class="note">Nothing planned. Enjoy it, or add a task.</p>'}<p class="note" style="margin:10px 0 0">${fm(capOn(today)-td.left)} of ${fm(capOn(today))} planned. <a href="#" onclick="go('plan');return false">Adjust the plan</a></p></div>
 <div class="card c5"><h2>Upcoming tests</h2>${tests.length?tests.map(t=>`<div class="row"><div class="g"><b>${esc(t.subject)}: ${esc(t.name)}</b><small>${dl(t.due)} · difficulty ${t.diff}/5</small></div></div>`).join(''):'<p class="note">No tests on the list.</p>'}<h2 style="margin-top:20px">Workload, next 7 days</h2>${cols(pl.days.map(d=>[new Date(d.d+'T00:00').toLocaleDateString(undefined,{weekday:'narrow'}),capOn(d.d)-d.left,d.left<0]),fm)}</div>
 <div class="card c12"><h2>Recommendations</h2>${recs().slice(0,3).map(r=>`<div class="tip ${r[0]}">${esc(r[1])}</div>`).join('')}</div></div>`}
function vTasks(){const fl=S.fin,l=S.tasks.filter(t=>!fl||t.status==fl).sort((a,b)=>a.due<b.due?-1:1);
 return`<div class="top"><div><h1>Tasks</h1><p class="sub">Assignments, projects and tests in one place.</p></div><button class="btn p" onclick="edit()">Add task</button></div>
 <div class="acts" style="justify-content:flex-start;margin:0 0 12px">${[['','All'],['todo','To do'],['doing','In progress'],['done','Done']].map(f=>`<button class="btn s ${S.fin==f[0]?'p':''}" onclick="S.fin='${f[0]}';render()">${f[1]}</button>`).join('')}</div>
 <div class="card">${l.length?l.map(t=>taskRow(t,`<span class="note">${t.status=='doing'?'In progress':''}</span><button class="btn s" onclick="edit('${t.id}')">Edit</button><button class="btn s d" onclick="del('${t.id}')">Delete</button>`)).join(''):'<p class="note">No tasks here yet. Add one with the button above.</p>'}</div>`}
function edit(id){const t=S.tasks.find(x=>x.id==id)||{name:'',subject:'',due:addD(2),diff:3,est:60,prio:'Medium',status:'todo',type:'Assignment'};
 const sel=(n,o,v)=>`<select name="${n}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 $('#dlg').innerHTML=`<h2>${id?'Edit task':'Add task'}</h2><form method="dialog" onsubmit="return false"><label>Name</label><input id="f_n" value="${esc(t.name)}" placeholder="Chapter 5 problem set"><div class="two"><div><label>Subject</label><input id="f_s" value="${esc(t.subject)}" list="subs" placeholder="Biology"><datalist id="subs">${[...new Set(S.tasks.map(x=>x.subject))].map(s=>`<option>${esc(s)}`).join('')}</datalist></div><div><label>Due date</label><input type="date" id="f_d" value="${t.due}"></div>
 <div><label>Type</label>${sel('type',['Assignment','Test','Project'],t.type).replace('name="type"','id="f_t"')}</div><div><label>Priority</label>${sel('p',['Low','Medium','High'],t.prio).replace('name="p"','id="f_p"')}</div>
 <div><label>Difficulty (1-5)</label><input type="number" id="f_x" min="1" max="5" value="${t.diff}"></div><div><label>Estimated minutes</label><input type="number" id="f_e" min="5" step="5" value="${t.est}"></div></div>
 <label>Status</label>${sel('s',['todo','doing','done'],t.status).replace('name="s"','id="f_u"')}
 <div class="acts"><button class="btn" onclick="$('#dlg').close()">Cancel</button><button class="btn p" onclick="saveT('${id||''}')">Save task</button></div></form>`;$('#dlg').showModal()}
function saveT(id){const n=$('#f_n').value.trim(),s=$('#f_s').value.trim();if(!n||!s||!$('#f_d').value)return toast('Add a name, subject and due date');
 const v={name:n,subject:s,due:$('#f_d').value,type:$('#f_t').value,prio:$('#f_p').value,diff:Math.min(5,Math.max(1,+$('#f_x').value||3)),est:Math.max(5,+$('#f_e').value||30),status:$('#f_u').value};
 setS(()=>{if(id)Object.assign(S.tasks.find(x=>x.id==id),v);else S.tasks.push({id:uid(),...v})},'Task saved');$('#dlg').close()}
function del(id){if(confirm('Delete this task?'))setS(()=>S.tasks=S.tasks.filter(t=>t.id!=id),'Task deleted')}
function vPlan(){const p=plan(),od=open().filter(t=>dd(t.due)<0);
 return`<div class="top"><div><h1>Planner</h1><p class="sub">Your plan is rebuilt from what's left, so missed days never break it.</p></div></div>
 <div class="card" style="margin-bottom:16px"><div class="top"><div><h2>Study time per day</h2><div class="acts" style="margin:0"><input type="number" id="cap" value="${S.cap}" min="0" step="15" style="width:90px"><span class="note" style="align-self:center">minutes</span><button class="btn s p" onclick="setS(()=>S.cap=Math.max(0,+$('#cap').value||0),'Plan updated')">Update</button></div></div>
 <div class="acts" style="margin:0"><button class="btn" onclick="setS(()=>S.capOv[today]=Math.round(capOn(today)/2),'Lighter day set. Work moved to later days')">Rough day: halve today</button><button class="btn" onclick="setS(()=>S.capOv[today]=0,'Today skipped. Work moved forward')">Skip today</button><button class="btn" onclick="setS(()=>S.capOv={},'Plan reset to your usual time')">Reset</button></div></div></div>
 ${od.length?`<div class="tip b card"><b>${od.length} overdue.</b> Bump due dates you've renegotiated with <a href="#" onclick="go('tasks');return false">Edit</a>. They're still scheduled first.</div>`:''}
 ${p.risk.length?`<div class="tip w card" style="margin-bottom:16px"><b>Won't fit:</b> ${p.risk.map(t=>esc(t.name)).join(', ')}. Add study time or adjust a due date.</div>`:''}
 <div class="planwrap"><div class="pl">${p.days.map((d,i)=>`<div class="pd ${i?'':'t0'}"><b>${i?new Date(d.d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'}):'Today'}</b>${d.items.map(x=>`<p>${esc(x.t.name)}<br>${fm(x.c)}</p>`).join('')||'<span class="note">Free</span>'}</div>`).join('')}</div></div>
 <p class="note" style="margin-top:14px">Priority score blends urgency, difficulty, test weight, priority and time left. A hard test tomorrow outranks an easy assignment next week.</p>`}
let tm=null;
function vStudy(){const r=T&&T.on;const rc=S.sessions.slice(-6).reverse();
 return`<h1>Study sessions</h1><p class="sub">Log real time so your insights come from your own habits.</p><div class="grid"><div class="card c6">${r?`<div class="lbl">${esc(T.subject)}${T.focus?' · '+esc(T.focus):''}</div><div class="timer" id="tm">${clk()}</div><div class="acts" style="justify-content:flex-start"><button class="btn p" onclick="stopS(true)">Finish: goal met</button><button class="btn" onclick="stopS(false)">Finish: goal not met</button></div>`:`<h2>Start a session</h2><label>Task (optional)</label><select id="s_t" onchange="pick()"><option value="">None</option>${ranked().map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><label>Subject</label><input id="s_s" list="subs2"><datalist id="subs2">${[...new Set(S.tasks.map(x=>x.subject))].map(s=>`<option>${esc(s)}`).join('')}</datalist><label>What will you work on?</label><input id="s_f" placeholder="Practice problems 1-10"><div class="acts"><button class="btn p" onclick="startS()">Start timer</button></div>`}</div>
 <div class="card c6"><h2>Recent sessions</h2>${rc.map(x=>`<div class="row"><div class="g"><b>${esc(x.subject)}</b><small>${esc(x.focus||'Study')} · ${dl(x.date)}</small></div><span class="tag ${x.done?'t':'m'}">${x.done?'Goal met':'Partial'}</span><b>${fm(x.min)}</b></div>`).join('')||'<p class="note">No sessions yet.</p>'}<h2 style="margin-top:18px">Add a past session</h2><div class="two"><input id="m_s" placeholder="Subject"><input id="m_m" type="number" placeholder="Minutes"></div><div class="acts"><button class="btn s" onclick="manual()">Log session</button></div></div></div>`}
const clk=()=>{const s=Math.floor((Date.now()-T.t0)/1e3);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function pick(){const t=S.tasks.find(x=>x.id==$('#s_t').value);if(t){$('#s_s').value=t.subject;$('#s_f').value=t.name}}
function startFor(id){setTimeout(()=>{$('#s_t').value=id;pick()},0)}
function startS(){const s=$('#s_s').value.trim();if(!s)return toast('Choose a subject first');T={on:1,t0:Date.now(),subject:s,focus:$('#s_f').value.trim(),taskId:$('#s_t').value};clearInterval(tm);tm=setInterval(()=>{const e=$('#tm');if(e)e.textContent=clk()},1000);render()}
function stopS(done){clearInterval(tm);const min=Math.max(1,Math.round((Date.now()-T.t0)/6e4));setS(()=>{S.sessions.push({id:uid(),date:today,subject:T.subject,focus:T.focus,taskId:T.taskId,min,done});T=null},'Session saved: '+fm(min))}
function manual(){const s=$('#m_s').value.trim(),m=+$('#m_m').value;if(!s||!m)return toast('Add a subject and minutes');setS(()=>S.sessions.push({id:uid(),date:today,subject:s,focus:'',min:m,done:true}),'Session logged')}
function vStats(){const ss=S.sessions,ts=S.tasks,dn=ts.filter(t=>t.status=='done').length,pc=ts.length?Math.round(dn/ts.length*100):0,es=estAct();
 const wk=[...Array(7)].map((_,i)=>{const d=addD(i-6);return[new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'narrow'}),ss.filter(x=>x.date==d).reduce((a,x)=>a+x.min,0)]});
 const sub=by(ss,x=>x.subject,x=>x.min),hard=Object.entries(ts.reduce((m,t)=>((m[t.subject]=m[t.subject]||[]).push(t.diff),m),{})).map(([k,v])=>[k,+(v.reduce((a,b)=>a+b)/v.length).toFixed(1)]).sort((a,b)=>b[1]-a[1]);
 const avg=Object.entries(ss.reduce((m,x)=>((m[x.subject]=m[x.subject]||[]).push(x.min),m),{})).map(([k,v])=>[k,Math.round(v.reduce((a,b)=>a+b)/v.length)]);
 const hit=ss.length?Math.round(ss.filter(x=>x.done).length/ss.length*100):0;
 return`<h1>Insights</h1><p class="sub">Patterns in your own data. ${ss.length<10?`With only ${ss.length} session(s) logged, treat these as early hints, not conclusions.`:'The more you log, the more reliable these get.'}</p><div class="grid">
 <div class="card c4"><h2>Tasks completed</h2><div style="display:flex;gap:16px;align-items:center"><div class="donut" style="background:conic-gradient(var(--ok) ${pc}%,var(--line) 0)"><b>${pc}%</b></div><div class="lbl">${dn} done<br>${ts.length-dn} still open</div></div></div>
 <div class="card c4"><h2>Consistency</h2><div class="num">${streak()}/14</div><div class="lbl">days with a study session in the last two weeks</div><div class="num" style="margin-top:14px">${hit}%</div><div class="lbl">sessions where you met your goal</div></div>
 <div class="card c4"><h2>Estimates vs. reality</h2>${es?`<div class="num">${Math.round(es.ratio*100)}%</div><div class="lbl">of estimated time actually spent, across ${es.n} finished task(s) with logged sessions</div>`:'<p class="note">Link sessions to tasks, then finish them, to compare estimates with actual time.</p>'}</div>
 <div class="card c6"><h2>Study time this week</h2>${cols(wk,fm)}</div>
 <div class="card c6"><h2>Study time by subject</h2>${hbars(sub,fm)}</div>
 <div class="card c6"><h2>Hardest subjects</h2><p class="note" style="margin:-6px 0 4px">Average difficulty of your tasks (1-5)</p>${hbars(hard)}</div>
 <div class="card c6"><h2>Average session length</h2>${hbars(avg,fm)}</div>
 <div class="card c12"><h2>Workload by due date</h2>${cols([...Array(7)].map((_,i)=>{const d=addD(i);return[new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short'}),open().filter(t=>t.due==d).reduce((a,t)=>a+t.est,0)]}),fm)}</div>
 <div class="card c12"><h2>Recommendations</h2>${recs().map(r=>`<div class="tip ${r[0]}">${esc(r[1])}</div>`).join('')}<div class="acts" style="justify-content:flex-start"><button class="btn s d" onclick="if(confirm('Erase all data?'))setS(()=>{S.tasks=[];S.sessions=[];S.capOv={}},'Data cleared')">Clear all data</button></div></div></div>`}
function sample(){const A=(n,s,d,df,e,p,ty='Assignment',st='todo')=>({id:uid(),name:n,subject:s,due:addD(d),diff:df,est:e,prio:p,type:ty,status:st});
 S.tasks=[A('Unit 4 exam','Biology',1,5,180,'High','Test'),A('Lab report','Chemistry',3,3,120,'Medium'),A('Essay draft','English',6,2,90,'Low'),A('Problem set 7','Calculus',2,4,90,'High'),A('Reading notes','History',4,2,45,'Low'),A('Vocab quiz','Spanish',5,2,40,'Medium','Test'),A('Problem set 6','Calculus',-1,3,60,'Medium','Assignment','done')];
 S.sessions=[[-6,'Calculus',45,1],[-5,'Chemistry',30,1],[-4,'Calculus',60,0],[-3,'English',25,1],[-2,'Chemistry',20,1],[-1,'Calculus',50,1],[-1,'Spanish',15,1]].map(x=>({id:uid(),date:addD(x[0]),subject:x[1],focus:'',min:x[2],done:!!x[3]}));save();render();toast('Sample data loaded')}
render();
</script></body></html>
